[project]
name = "task-final"
version = "0.1.0"
description = "Task Manager - AI-powered task summarization with OpenAI integration"
readme = "README.md"
authors = [
    { name = "Matteo Bongiorno", email = "pot8toking@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.8.1",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
task-final = "task_final:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["task_final*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
